<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f7f1e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151718" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Jarvis</title>
<style>
  /* Sidebud's palette: charcoal, ivory and amber; light is its inverse. */
  :root {
    --bg: #f7f1e6; --surface: #fffaf1; --raised: #efe6d6; --border: #e2d7c3; --text: #1d1f20; --muted: #6f685c;
    --dim: #8f877a; --amber: #e9a12a; --amber-ink: #151718; --amber-soft: rgba(233, 161, 42, .16); --green: #2f9e66;
    --warn: #d9822b; --red: #d6503d; --code-bg: #f1e9da; --scrim: rgba(21, 23, 24, .38); --shadow: 0 10px 30px rgba(60, 45, 20, .12);
    --tk: #a2479f; --ts: #2f7d4f; --tn: #b5591d; --tc: #8f877a; --tf: #2c64b8;
    --radius: 18px; --side: 284px; --app-h: 100dvh;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151718; --surface: #1f2223; --raised: #292d2e; --border: #353a3b; --text: #fef3e1; --muted: #aba496;
      --dim: #8a857a; --amber: #feb93e; --amber-ink: #151718; --amber-soft: rgba(254, 185, 62, .14); --green: #7fd0a0;
      --warn: #ffa84a; --red: #ff7a68; --code-bg: #191b1c; --scrim: rgba(0, 0, 0, .55); --shadow: 0 12px 34px rgba(0, 0, 0, .45);
      --tk: #e3a6f2; --ts: #9fd8a8; --tn: #ffbe7a; --tc: #8a857a; --tf: #8fc1ff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font: 500 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled, [aria-disabled="true"] { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 10px; }
  svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 14px; color: var(--muted); }
  .icon-btn:hover { background: var(--raised); color: var(--text); }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 14px; display: inline-flex; align-items: center; gap: 8px;
         background: var(--raised); font-weight: 600; }
  .btn.primary { background: var(--amber); color: var(--amber-ink); }
  .btn:hover:not(:disabled) { filter: brightness(1.05); }

  /* ------------------------------------------------ layout */
  .app { height: var(--app-h); display: grid; grid-template-columns: var(--side) 1fr;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  aside { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 14px 14px 8px 16px; }
  .brand b { font-size: 16px; letter-spacing: .2px; }
  .brand small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 500; line-height: 1.2; }
  .mark { width: 30px; height: 30px; border-radius: 50%; flex: none;
          background: radial-gradient(circle at 35% 30%, #ffe2a6, var(--amber) 55%, #b86b0a); box-shadow: 0 0 0 3px var(--amber-soft); }
  .new { margin: 6px 12px 10px; justify-content: center; }
  #convs { flex: 1; overflow-y: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .conv { display: flex; align-items: center; border-radius: 12px; min-height: 44px; }
  .conv:hover, .conv.on { background: var(--raised); }
  .conv > .open { flex: 1; min-width: 0; text-align: left; padding: 8px 10px; min-height: 44px; }
  .conv .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .conv .w { display: block; color: var(--dim); font-size: 11.5px; }
  .conv .acts { display: none; padding-right: 4px; }
  .conv:hover .acts, .conv:focus-within .acts, .conv.on .acts { display: flex; }
  @media (hover: none) { .conv.on .acts { display: flex; } }
  .conv .acts .icon-btn { width: 36px; height: 36px; }
  .conv input { flex: 1; min-width: 0; margin: 4px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--amber); background: var(--bg); }
  .side-foot { border-top: 1px solid var(--border); padding: 8px; display: flex; gap: 4px; }
  .side-foot .btn { flex: 1; background: none; color: var(--muted); font-weight: 500; justify-content: flex-start; }
  .side-foot .btn:hover { background: var(--raised); color: var(--text); }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .top { display: flex; align-items: center; gap: 6px; padding: 8px 12px; min-height: 60px; }
  #menu { display: none; }
  #title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
          display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .pill:hover { color: var(--text); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  [data-s="ready"] > .dot, .dot[data-s="ready"] { background: var(--green); }
  [data-s="busy"] > .dot, .dot[data-s="busy"] { background: var(--amber); }
  [data-s="loading"] > .dot, .dot[data-s="loading"] { background: var(--warn); animation: blink 1.2s infinite; }
  [data-s="failed"] > .dot, .dot[data-s="failed"], [data-s="offline"] > .dot { background: var(--red); }
  @keyframes blink { 50% { opacity: .35; } }
  .pop { position: absolute; right: 12px; top: 58px; z-index: 30; width: min(360px, calc(100vw - 24px)); background: var(--surface);
         border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
  .pop h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); }
  .pop .m { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 14px; }
  .pop .m span:nth-child(2) { flex: 1; }
  .pop .m em { font-style: normal; color: var(--muted); font-size: 12.5px; }
  .pop .lat { font-size: 13px; color: var(--muted); margin: 10px 0 0; line-height: 1.6; }
  .pop .lat b { color: var(--text); font-weight: 600; }
  .pop .row-b { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }

  #scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; overflow-anchor: auto; }
  #log { max-width: 780px; margin: 0 auto; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 18px; }
  .empty { width: 100%; max-width: 640px; margin: 10vh auto 0; padding: 0 20px; text-align: center; }
  .empty .mark { width: 64px; height: 64px; margin: 0 auto 18px; box-shadow: 0 0 0 8px var(--amber-soft); }
  .empty h2 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .empty p { color: var(--muted); margin: 0 0 22px; }
  .sugg { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; text-align: left; }
  .sugg button { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; min-height: 56px; }
  .sugg button:hover { border-color: var(--amber); }
  .sugg b { display: block; font-size: 14px; }
  .sugg span { color: var(--muted); font-size: 13px; }

  /* ------------------------------------------------ messages */
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .row.user { justify-content: flex-end; }
  .col { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .row.user .col { align-items: flex-end; max-width: min(85%, 620px); }
  .row.assistant .col { flex: 1; }
  .av { width: 30px; height: 30px; border-radius: 50%; flex: none; margin-top: 2px;
        background: radial-gradient(circle at 35% 30%, #ffe2a6, var(--amber) 55%, #b86b0a); }
  .av.ghost { background: none; }
  .head { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
  .head b { font-weight: 700; }
  time, .via { color: var(--dim); font-size: 12px; font-weight: 500; }
  .foot .via:not(:empty) { margin-right: 6px; }
  .bubble { background: var(--amber); color: var(--amber-ink); border-radius: 18px 18px 6px 18px; padding: 9px 14px;
            white-space: pre-wrap; overflow-wrap: anywhere; }
  .row.user.partial .bubble { background: var(--amber-soft); color: var(--muted); font-style: italic; }
  .foot { display: flex; align-items: center; gap: 2px; min-height: 30px; color: var(--dim); font-size: 12px; flex-wrap: wrap; }
  .foot .icon-btn { width: 32px; height: 32px; border-radius: 10px; }
  .foot .icon-btn svg { width: 16px; height: 16px; }
  .foot .lat { margin-right: 6px; }
  @media (hover: hover) { .row .foot .icon-btn { opacity: 0; } .row:hover .foot .icon-btn, .row:focus-within .foot .icon-btn { opacity: 1; } }
  .tag { color: var(--warn); font-size: 12px; margin-right: 6px; }
  .err { color: var(--red); font-size: 13px; }
  .sys { align-self: center; color: var(--muted); font-size: 13px; text-align: center; max-width: 90%; background: var(--surface);
         border: 1px solid var(--border); border-radius: 999px; padding: 4px 14px; }
  .sys.error { color: var(--red); border-color: var(--red); }

  .md { overflow-wrap: anywhere; min-height: 1.55em; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md table, .md blockquote, .md .code { margin: .55em 0; }
  .md ul, .md ol { padding-left: 1.4em; }
  .md li + li { margin-top: .2em; }
  .md h1, .md h2, .md h3, .md h4 { font-size: 1.06em; margin: .9em 0 .35em; }
  .md a { color: var(--amber); text-underline-offset: 2px; }
  .md :not(pre) > code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 0 5px;
                         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14px; }
  .md th, .md td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
  .md th { background: var(--raised); }
  .md blockquote { border-left: 3px solid var(--amber); padding-left: 12px; color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--border); }
  .md img { max-width: 100%; border-radius: 12px; }
  .code { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--code-bg); }
  .code-h { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 2px 12px; font-size: 12px;
            color: var(--muted); border-bottom: 1px solid var(--border); background: var(--raised); }
  .code-h button { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 10px; }
  .code-h button:hover { background: var(--bg); color: var(--text); }
  .code-h svg { width: 15px; height: 15px; }
  .code pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tk { color: var(--tk); } .ts { color: var(--ts); } .tn { color: var(--tn); } .tc { color: var(--tc); font-style: italic; } .tf { color: var(--tf); }
  .dots { display: inline-flex; gap: 4px; padding: 6px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); animation: bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-4px); opacity: 1; } }

  details.think { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  details.think summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 40px;
                          padding: 0 12px; color: var(--muted); font-size: 13px; }
  details.think summary::-webkit-details-marker { display: none; }
  details.think summary svg { width: 16px; height: 16px; transition: transform .15s; }
  details.think[open] summary svg.chev { transform: rotate(90deg); }
  details.think .tb { padding: 0 14px 12px; color: var(--muted); font-size: 13.5px; white-space: pre-wrap; max-height: 320px; overflow-y: auto; }
  .think.live summary span { background: linear-gradient(90deg, var(--muted), var(--text), var(--muted)); background-size: 200% 100%;
                              -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 1.6s linear infinite; }
  @keyframes sheen { to { background-position: -200% 0; } }

  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin: 0; }
  .card .thumb { display: block; width: 100%; background: var(--raised); min-height: 120px; }
  .card img { display: block; width: 100%; height: auto; }
  .card video { display: block; width: 100%; background: #000; }
  .card figcaption { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 14px; font-size: 13px; color: var(--muted); }
  .card figcaption span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.pending .thumb { aspect-ratio: 1; position: relative; overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .card.pending .thumb::after { content: ""; position: absolute; inset: 0;
                                background: linear-gradient(100deg, transparent 20%, var(--amber-soft) 50%, transparent 80%);
                                animation: shimmer 1.6s infinite; transform: translateX(-100%); }
  @keyframes shimmer { to { transform: translateX(100%); } }

  /* ------------------------------------------------ composer */
  .composer { padding: 6px 16px calc(10px + env(safe-area-inset-bottom)); }
  .box { max-width: 780px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
         padding: 6px; box-shadow: var(--shadow); }
  .box:focus-within { border-color: var(--amber); }
  #text { display: block; width: 100%; resize: none; border: 0; background: none; outline: none; padding: 10px 12px 4px;
          min-height: 44px; max-height: 200px; line-height: 1.45; font-size: 16px; }
  .tools { display: flex; align-items: center; gap: 4px; }
  .tools .grow { flex: 1; }
  .chip { min-height: 36px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
          font-size: 13px; color: var(--muted); border: 1px solid transparent; }
  .chip:hover { background: var(--raised); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--amber-soft); color: var(--text); border-color: var(--amber); }
  .chip svg { width: 16px; height: 16px; }
  #mic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); color: var(--text); }
  #mic:hover { background: var(--amber-soft); }
  #mic[data-on="1"] { background: var(--amber); color: var(--amber-ink); }
  #send { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--amber); color: var(--amber-ink); }
  #send:disabled { background: var(--raised); color: var(--dim); opacity: 1; }
  #send svg, #mic svg { width: 22px; height: 22px; }
  .hint { max-width: 780px; margin: 6px auto 0; text-align: center; color: var(--dim); font-size: 11.5px; }
  #vbar { max-width: 780px; margin: 0 auto 8px; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px;
          border-radius: 999px; background: var(--amber-soft); border: 1px solid var(--amber); font-size: 14px; }
  #vbar .grow { flex: 1; }
  #vbarText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  /* ------------------------------------------------ voice mode */
  #vm { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column;
        padding: calc(8px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
  #vm[hidden] { display: none; }
  .vm-top { display: flex; align-items: center; gap: 8px; }
  .vm-top .grow { flex: 1; }
  .end { min-height: 44px; padding: 0 18px; border-radius: 22px; background: var(--red); color: #fff; font-weight: 700;
         display: inline-flex; align-items: center; gap: 8px; }
  .end i { width: 12px; height: 12px; border-radius: 3px; background: currentColor; }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 0; }
  .orb { --lvl: 0; position: relative; width: min(56vw, 260px); aspect-ratio: 1; border-radius: 50%; display: block; }
  .orb > span { position: absolute; inset: 0; border-radius: 50%; }
  .orb .glow { inset: -18%; background: radial-gradient(circle, var(--amber-soft) 0%, transparent 70%);
               transform: scale(calc(.85 + var(--lvl) * .45)); transition: transform 90ms linear; }
  .orb .core { background: radial-gradient(circle at 34% 28%, #fff0cc 0%, #ffd27a 18%, var(--amber) 48%, #b05f00 100%);
               box-shadow: inset -14px -18px 40px rgba(110, 50, 0, .35), 0 18px 50px rgba(233, 161, 42, .35);
               transform: scale(calc(.9 + var(--lvl) * .16)); transition: transform 90ms linear, filter .3s; }
  .orb .ring { inset: -7%; border: 2px solid var(--amber); opacity: 0; }
  .orb[data-state="hearing"] .ring, .orb[data-state="talking"] .ring { opacity: .7; animation: ring 1.4s ease-out infinite; }
  .orb[data-state="thinking"] .ring { opacity: .85; border-style: dashed; border-width: 3px; animation: spin 3.2s linear infinite; }
  .orb[data-state="muted"] .core, .orb[data-state="connecting"] .core, .orb[data-state="ptt"] .core { filter: saturate(.25) brightness(.85); }
  .orb[data-state="speaking"] .core { filter: saturate(1.15); }
  @keyframes ring { from { transform: scale(.95); opacity: .7; } to { transform: scale(1.22); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .vm-state { font-size: 22px; font-weight: 700; min-height: 1.4em; text-align: center; }
  .vm-hint { color: var(--muted); font-size: 14px; min-height: 1.4em; text-align: center; }
  .wave { display: flex; align-items: center; justify-content: center; gap: 3px; height: 64px; }
  .wave i { width: 2.5px; height: 64px; border-radius: 2px; background: var(--muted); transform: scaleY(.06); transform-origin: center; }
  .wave.live i { background: var(--amber); }
  .vt { width: min(620px, 100%); text-align: center; min-height: 5.2em; }
  .vt p { margin: 4px 0; }
  #vmYou { color: var(--muted); font-style: italic; }
  #vmBot { font-size: 17px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .vm-lat { color: var(--dim); font-size: 12.5px; min-height: 1.4em; }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 3px; }
  .seg button { min-height: 40px; padding: 0 16px; border-radius: 13px; color: var(--muted); font-weight: 600; font-size: 14px; }
  .seg button[aria-checked="true"] { background: var(--raised); color: var(--text); }
  #talk { min-width: 220px; min-height: 64px; border-radius: 22px; background: var(--amber); color: var(--amber-ink);
          display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 700; padding: 0 22px;
          -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #talk small { display: block; font-size: 12px; font-weight: 500; opacity: .75; }
  #talk[data-s="muted"] { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  #talk[data-s="talking"] { transform: scale(.97); box-shadow: 0 0 0 6px var(--amber-soft); }
  #talk svg { width: 24px; height: 24px; }

  /* ------------------------------------------------ drawer, lightbox, toast */
  dialog { color: var(--text); }
  dialog::backdrop { background: var(--scrim); }
  .drawer { margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(420px, 100vw); border: 0; padding: 0;
            background: var(--bg); border-left: 1px solid var(--border); }
  .drawer[open] { animation: slide .22s ease-out; }
  @keyframes slide { from { transform: translateX(30px); opacity: .4; } }
  .drawer .dh { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
                padding: calc(8px + env(safe-area-inset-top)) 8px 8px 20px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .drawer .dh h2 { margin: 0; font-size: 18px; }
  .drawer .db { padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
  .sect { scroll-margin-top: 76px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .sect h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .field > span { color: var(--muted); font-size: 13px; }
  .field select, .field input[type=text], .field input[type=password], .field input[type=number], .field textarea, .search {
    min-height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); padding: 8px 12px; }
  .field textarea { min-height: 84px; resize: vertical; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-size: 14px; }
  .switch small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .switch input { appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--raised); border: 1px solid var(--border);
                  position: relative; cursor: pointer; flex: none; transition: background .15s; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
                         background: var(--muted); transition: transform .15s, background .15s; }
  .switch input:checked { background: var(--amber); border-color: var(--amber); }
  .switch input:checked::after { transform: translateX(18px); background: var(--amber-ink); }
  input[type=range] { width: 100%; accent-color: var(--amber); min-height: 32px; }
  .range-row { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; }
  .engines { display: grid; gap: 8px; }
  .engine, .vrow { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; border-radius: 14px;
                   border: 1px solid var(--border); background: var(--bg); text-align: left; width: 100%; }
  .engine[aria-checked="true"], .vrow[aria-checked="true"] { border-color: var(--amber); background: var(--amber-soft); }
  .engine b, .vrow b { display: block; font-size: 14px; }
  .engine small, .vrow small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
  .engine > span, .vrow > span { flex: 1; min-width: 0; }
  .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex: none; display: grid; place-items: center; }
  [aria-checked="true"] > .radio { border-color: var(--amber); }
  [aria-checked="true"] > .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--amber); }
  #voices { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow-y: auto; }
  .vline { display: flex; gap: 6px; align-items: center; }
  .vline .vrow { flex: 1; }
  .play { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); flex: none; }
  .play[data-busy="1"] { animation: blink 1s infinite; }
  .play[data-playing="1"] { background: var(--amber); color: var(--amber-ink); }
  .play svg { width: 18px; height: 18px; }
  .note-s { color: var(--muted); font-size: 12.5px; }
  #lightbox { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
  #lightbox img { display: block; max-width: 96vw; max-height: 86vh; border-radius: 14px; }
  #lightbox .lb { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
  #toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60;
           background: var(--text); color: var(--bg); border-radius: 14px; padding: 8px 8px 8px 16px; display: flex; align-items: center;
           gap: 10px; box-shadow: var(--shadow); font-size: 14px; }
  #toast button { color: var(--amber); font-weight: 700; min-height: 36px; padding: 0 10px; }
  #toast { pointer-events: none; } #toast button { pointer-events: auto; }
  body.voice-open #toast { top: calc(70px + env(safe-area-inset-top)); bottom: auto; } /* clear of the voice controls */
  .scrim { display: none; }

  /* ------------------------------------------------ narrow screens */
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    aside { position: fixed; z-index: 50; top: 0; bottom: 0; left: 0; width: min(86vw, 320px); transform: translateX(-102%);
            transition: transform .2s ease-out; padding-top: env(safe-area-inset-top); box-shadow: var(--shadow); }
    .app.side-open aside { transform: none; }
    .app.side-open .scrim { display: block; position: fixed; inset: 0; z-index: 45; background: var(--scrim); }
    #menu { display: inline-grid; }
    .top { padding: 6px 8px; }
    #log { padding: 4px 12px 20px; }
    .composer { padding: 4px 10px calc(8px + env(safe-area-inset-bottom)); }
    .pill .lbl { display: none; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside id="side" aria-label="Conversations">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><b>Jarvis</b><small>LocalRouter, on this machine</small></div></div>
    <button class="btn primary new" id="newChat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
    <nav id="convs" aria-label="Conversation list"></nav>
    <div class="side-foot">
      <button class="btn" id="sideSettings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="top">
      <button class="icon-btn" id="menu" aria-label="Conversations" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div id="title">New chat</div>
      <button class="pill" id="statusPill" aria-haspopup="dialog" aria-expanded="false" data-s="loading"><span class="dot"></span><span class="lbl">Connecting</span><span id="pillLat"></span></button>
      <button class="icon-btn" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
      <div class="pop" id="statusPop" role="dialog" aria-label="Models and latency" hidden></div>
    </div>
    <div id="scroll"><div id="log" role="log" aria-live="polite" aria-label="Conversation"></div></div>
    <div class="composer">
      <div id="vbar" hidden><span class="dot" data-s="ready"></span><span id="vbarText">Voice on</span><span class="grow"></span>
        <button class="btn" id="vbarOpen">Open</button><button class="end" id="vbarEnd"><i></i>End</button></div>
      <div class="box">
        <label class="sr" for="text">Message</label>
        <textarea id="text" rows="1" placeholder="Message Jarvis" autocomplete="off" enterkeyhint="send"></textarea>
        <div class="tools">
          <button class="icon-btn" id="attach" aria-disabled="true" aria-label="Attach files (not available yet)" title="Attachments are not available yet"><svg viewBox="0 0 24 24"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4L15.5 7"/></svg></button>
          <button class="chip" id="think" aria-pressed="false" title="Let the model reason before it answers"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg>Reasoning</button>
          <span class="grow"></span>
          <button id="mic" aria-label="Start voice mode"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg></button>
          <button id="send" aria-label="Send" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line · conversations stay in this browser</div>
    </div>
  </main>
</div>

<section id="vm" hidden aria-label="Voice mode">
  <div class="vm-top">
    <button class="icon-btn" id="vmMin" aria-label="Back to the chat (voice stays on)"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="chip" id="vmVoice" aria-label="Choose the voice"><svg viewBox="0 0 24 24"><path d="M3 10v4M7 6v12M11 3v18M15 8v8M19 11v2"/></svg><span id="vmVoiceName">Voice</span></button>
    <span class="grow"></span>
    <button class="end" id="vmEnd"><i></i>End</button>
  </div>
  <div class="stage">
    <button class="orb" id="orb" data-state="connecting" aria-label="Voice"><span class="glow"></span><span class="ring"></span><span class="core"></span></button>
    <div class="vm-state" id="vmState" aria-live="polite">Connecting…</div>
    <div class="vm-hint" id="vmHint"></div>
    <div class="wave" id="wave" aria-hidden="true"></div>
    <div class="vt" aria-live="polite"><p id="vmYou"></p><p id="vmBot"></p></div>
    <div class="vm-lat" id="vmLat"></div>
  </div>
  <div class="controls">
    <div class="seg" role="radiogroup" aria-label="How turns end">
      <button role="radio" data-mode="vad" aria-checked="true">Hands-free</button>
      <button role="radio" data-mode="ptt" aria-checked="false">Push to talk</button>
    </div>
    <button id="talk" data-s="listening"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg><span><span id="talkLbl">Listening</span><small id="talkSub">Tap to mute</small></span></button>
  </div>
</section>

<dialog class="drawer" id="drawer" aria-labelledby="drawerTitle">
  <div class="dh"><h2 id="drawerTitle">Settings</h2><button class="icon-btn" id="drawerClose" aria-label="Close settings"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="db">
    <section class="sect" aria-labelledby="hChat">
      <h3 id="hChat">Chat</h3>
      <label class="field"><span>Model</span><select id="chatmodel"></select></label>
      <label class="switch"><span>Reasoning<small>Think before answering (slower first word)</small></span><input type="checkbox" id="thinkSw"></label>
      <label class="switch"><span>Image and video tools<small>The model may make pictures and clips</small></span><input type="checkbox" id="tools"></label>
      <label class="field"><span>Max reply tokens</span><input type="number" id="maxtok" min="16" max="32768" step="16" placeholder="the model's default"></label>
      <label class="field"><span>Instructions (system prompt)</span><textarea id="instructions" placeholder="You are Jarvis, a helpful assistant…"></textarea></label>
    </section>
    <section class="sect" id="voiceSect" aria-labelledby="hVoice">
      <h3 id="hVoice">Voice</h3>
      <div class="field"><span>Speech engine</span><div class="engines" id="engines" role="radiogroup" aria-label="Speech engine"></div></div>
      <div class="field"><span id="voicesLbl">Voice</span>
        <input class="search" id="vsearch" type="search" placeholder="Search voices" aria-label="Search voices" hidden>
        <div id="voices" role="radiogroup" aria-labelledby="voicesLbl"></div>
        <span class="note-s" id="vsource"></span></div>
    </section>
    <section class="sect" aria-labelledby="hFree">
      <h3 id="hFree">Hands-free</h3>
      <label class="field"><span>Sensitivity</span><input type="range" id="sens" min="0" max="100" step="5">
        <span class="range-row"><span>Ignores more noise</span><span>Hears quiet speech</span></span></label>
      <label class="field"><span>Pause before I reply: <b id="silenceV"></b></span><input type="range" id="silence" min="200" max="1500" step="50">
        <span class="range-row"><span>Snappy</span><span>Patient</span></span></label>
      <label class="switch"><span>Echo guard<small>Ignore my own voice from the speaker</small></span><input type="checkbox" id="gate"></label>
    </section>
    <section class="sect" aria-labelledby="hAdv">
      <h3 id="hAdv">Advanced</h3>
      <label class="field"><span>API key (only if a proxy in front asks for one)</span><input type="password" id="key" autocomplete="off" placeholder="none"></label>
      <label class="field"><span>Debug log lines to copy</span><input type="number" id="logn" min="20" max="2000" step="10"></label>
      <div class="vline"><button class="btn" id="copylog2">Copy debug log</button><span class="grow"></span><button class="btn" id="wipeAll">Delete all chats</button></div>
    </section>
  </div>
</dialog>

<dialog id="lightbox" aria-label="Image">
  <img id="lbImg" alt="">
  <div class="lb"><a class="btn" id="lbDl" download>Download</a><button class="btn primary" id="lbClose">Close</button></div>
</dialog>
<div id="toast" role="status" hidden><span id="toastText"></span><button id="toastUndo">Undo</button></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const RATE = 24000;
const CHUNK = 960; // 40 ms of 24 kHz samples a microphone message
const LOUD = 250 / 32768; // a reply sample above this is audible (about -42 dBFS), as the daemon's timing counts it
const DEFAULT_SYSTEM = "You are Jarvis, a helpful assistant running on the user's own machine. Be concise.";
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const I = {
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',
  regen: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M12 4v12M6 11l6 6 6-6M5 21h14"/></svg>',
  expand: '<svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  send: '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
  bulb: '<svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg>',
  mic: '<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>',
  micOff: '<svg viewBox="0 0 24 24"><path d="M3 3l18 18M9 9v1a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.7-1.3M19 10a7 7 0 0 1-1.1 3.8M5 10a7 7 0 0 0 10.6 6M12 17v5"/></svg>',
};
const CHAT_TOOLS = {
  image: { type: 'function', function: { name: 'generate_image', description: 'Make a picture on this machine from a detailed description. The user sees it inline.',
    parameters: { type: 'object', properties: { prompt: { type: 'string', description: 'what to draw, in detail' },
      size: { type: 'string', description: 'WIDTHxHEIGHT in multiples of 16, e.g. 1024x1024 (default) or 1344x768' } }, required: ['prompt'] } } },
  video: { type: 'function', function: { name: 'generate_video', description: 'Make a short video clip with sound on this machine. It takes minutes.',
    parameters: { type: 'object', properties: { prompt: { type: 'string', description: 'what happens, in detail' },
      seconds: { type: 'integer', description: 'length, 1 to 20 (default 5)' } }, required: ['prompt'] } } },
};
const SUGGEST = [
  ['Explain something', 'How does a GPU speed up neural networks?'],
  ['Make a picture', 'Make me a picture of a red fox sitting in fresh snow.'],
  ['Write code', 'Write a Python function that merges two sorted lists.'],
  ['Plan', 'Plan a relaxed three-day trip to Kyoto.'],
];

// ---------------------------------------------------------------- storage, settings, debug log

const store = {
  get(k, d) { try { const v = localStorage.getItem('jarvis.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) {
    try { localStorage.setItem('jarvis.' + k, JSON.stringify(v)); } catch (e) {
      if (k === 'convs' && convs.length > 1) { convs.sort((a, b) => b.updated - a.updated).pop(); store.set(k, convs); }
      else dbg('storage', { error: e.message });
    }
  },
};
const S = Object.assign({ chatModel: '', think: false, speechModel: '', voices: {}, mode: 'vad', silence: 500, threshold: 0.5,
  tools: true, gate: true, logN: 300, key: '', instructions: '', maxTokens: 0 }, store.get('settings', {}));
if (S.voice && S.speechModel && !S.voices[S.speechModel]) S.voices[S.speechModel] = S.voice; // the earlier single voice
delete S.voice;
const saveSettings = () => store.set('settings', S);

const debug = [];
function dbg(kind, data) {
  debug.push({ t: Math.round(performance.now()), at: new Date().toISOString(), kind, ...data });
  if (debug.length > 2000) debug.splice(0, debug.length - 2000);
}
window.addEventListener('error', e => dbg('page.error', { message: e.message, at: `${e.filename}:${e.lineno}` }));
window.addEventListener('unhandledrejection', e => dbg('page.rejection', { message: String(e.reason && e.reason.message || e.reason) }));

// A key in the URL fragment (#key=...) is taken once and removed from the address bar.
(function keyFromFragment() {
  const m = /(?:^|[#&])key=([^&]+)/.exec(location.hash);
  if (!m) return;
  S.key = decodeURIComponent(m[1]);
  saveSettings();
  history.replaceState(null, '', location.pathname + location.search);
})();

// ---------------------------------------------------------------- conversations and the sidebar

let convs = store.get('convs', []);
let cur = null;
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function newConv() {
  cur = { id: uid('c'), title: '', updated: Date.now(), msgs: [] };
  convs.unshift(cur);
  store.set('current', cur.id);
  return cur;
}
function saveConv() {
  if (!cur) return;
  cur.updated = Date.now();
  const first = cur.msgs.find(m => m.role === 'user' && m.text);
  if (first && !cur.named) cur.title = first.text.slice(0, 60);
  if (!convs.includes(cur)) convs.unshift(cur);
  store.set('convs', convs);
  renderSide();
  renderTitle();
}
function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
let renaming = null;
function renderSide() {
  const list = convs.filter(c => c.msgs.length || c === cur).sort((a, b) => b.updated - a.updated);
  $('convs').replaceChildren(...list.map(c => {
    const row = Object.assign(document.createElement('div'), { className: 'conv' + (c === cur ? ' on' : '') });
    if (renaming === c.id) {
      const inp = Object.assign(document.createElement('input'), { value: c.title || '', 'aria-label': 'Conversation name' });
      inp.setAttribute('aria-label', 'Conversation name');
      const done = save => { renaming = null; if (save && inp.value.trim()) { c.title = inp.value.trim(); c.named = true; store.set('convs', convs); } renderSide(); renderTitle(); };
      inp.onkeydown = e => { if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); };
      inp.onblur = () => done(true);
      row.append(inp);
      setTimeout(() => { inp.focus(); inp.select(); }, 0);
      return row;
    }
    const open = Object.assign(document.createElement('button'), { className: 'open' });
    open.append(Object.assign(document.createElement('span'), { className: 't', textContent: c.title || 'New chat' }),
                Object.assign(document.createElement('span'), { className: 'w', textContent: ago(c.updated) }));
    if (c === cur) open.setAttribute('aria-current', 'page');
    open.onclick = () => { if (!busy) { openConv(c.id); closeSide(); } };
    const acts = Object.assign(document.createElement('span'), { className: 'acts' });
    const ren = Object.assign(document.createElement('button'), { className: 'icon-btn', innerHTML: I.edit });
    ren.setAttribute('aria-label', `Rename “${c.title || 'New chat'}”`);
    ren.onclick = () => { renaming = c.id; renderSide(); };
    const del = Object.assign(document.createElement('button'), { className: 'icon-btn', innerHTML: I.trash });
    del.setAttribute('aria-label', `Delete “${c.title || 'New chat'}”`);
    del.onclick = () => deleteConv(c);
    acts.append(ren, del);
    row.append(open, acts);
    return row;
  }));
}
function deleteConv(c) {
  if (busy && c === cur) return;
  const at = convs.indexOf(c);
  convs.splice(at, 1);
  store.set('convs', convs);
  if (c === cur) openConv((convs.find(x => x.msgs.length) || newConv()).id);
  else renderSide();
  toast(`Deleted “${(c.title || 'New chat').slice(0, 40)}”`, () => { convs.splice(at, 0, c); store.set('convs', convs); openConv(c.id); });
}
let toastTimer = 0;
function toast(text, undo) {
  $('toastText').textContent = text;
  $('toastUndo').hidden = !undo;
  $('toastUndo').onclick = () => { $('toast').hidden = true; undo && undo(); };
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, 5000);
}
function renderTitle() { $('title').textContent = (cur && cur.title) || 'New chat'; }
function openConv(id) {
  if (V.ws) voiceStop(); // the voice session holds the other conversation's history

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (S.key) headers.authorization = 'Bearer ' + S.key;
  if (opts.json !== undefined) { headers['content-type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  const r = await fetch(path, { method: opts.method || (opts.body ? 'POST' : 'GET'), headers, body: opts.body, signal: opts.signal });
  if (r.status === 401 && !opts.retried) {
    const k = prompt('This LocalRouter needs an API key:', S.key || '');
    if (k) { S.key = k.trim(); saveSettings(); return api(path, Object.assign({}, opts, { retried: true })); }
  }
  return r;
}

}

let busy = null; // {ctl} while a chat reply streams
function apiMessages() {
  const msgs = [{ role: 'system', content: S.instructions.trim() || DEFAULT_SYSTEM }];
  const list = cur.msgs.filter(m => !m.partial && (m.role === 'user' || m.role === 'assistant' || m.role === 'tool'));
  for (const m of list) {
    if (m.role === 'user' && m.text) msgs.push({ role: 'user', content: m.text });
    else if (m.role === 'assistant') {
      const content = splitThink(m.text || '').answer;
      if (m.calls && m.calls.length) msgs.push({ role: 'assistant', content: content || null, tool_calls: m.calls });
      else if (content) msgs.push({ role: 'assistant', content });
    } else if (m.role === 'tool') {
      if (m.callId && msgs.some(x => x.tool_calls && x.tool_calls.some(c => c.id === m.callId))) msgs.push({ role: 'tool', tool_call_id: m.callId, content: m.result || m.text || '' });
      else if (m.media && m.media.length) msgs.push({ role: 'system', content: `The ${m.media[0].kind} was made: ${m.media.map(x => x.url).join(' ')}` });
    }
  }
  // A tool call that never got its result (the reply was stopped) still needs one, or the chat API refuses the history.
  for (let i = msgs.length - 1; i >= 0; i--) {
    const calls = msgs[i].tool_calls;
    if (!calls) continue;
    let j = i + 1;
    while (j < msgs.length && msgs[j].role === 'tool') j++;
    const answered = new Set(msgs.slice(i + 1, j).map(x => x.tool_call_id));
    msgs.splice(j, 0, ...calls.filter(c => !answered.has(c.id)).map(c => ({ role: 'tool', tool_call_id: c.id, content: '{"status":"cancelled"}' })));

}
function chatBody() {

}
async function chatTurn() {
  const ctl = new AbortController();

    for (let round = 0; round < 4; round++) {
      const am = addMsg({ role: 'assistant', text: '', reasoning: '', streaming: true, via: 'text' });
      const calls = await streamReply(am, ctl.signal);
      am.streaming = false;
      draw(am);
      saveConv();
      if (!calls.length) break;
      am.calls = calls.map(c => ({ id: c.id, type: 'function', function: { name: c.name, arguments: c.args } }));
      saveConv();
      for (const c of am.calls) await runTool(c, ctl.signal);

    if (e.name !== 'AbortError') note(`Chat failed: ${e.message}`, true);
  } finally {
    const last = cur.msgs[cur.msgs.length - 1];
    if (last && last.streaming) { last.streaming = false; if (ctl.signal.aborted) last.interrupted = true; draw(last); }

async function streamReply(am, signal) {
  const body = chatBody();
  dbg('chat.request', { messages: body.messages.length, think: S.think, tools: (body.tools || []).length });
  const t0 = performance.now();
  const r = await api('/v1/chat/completions', { json: body, signal });
  if (!r.ok) { am.error = await errorText(r); dbg('chat.error', { status: r.status, error: am.error }); return []; }
  const reader = r.body.getReader();

  let buf = '', first = 0, last = 0, pieces = 0, usage = null, finish = '', thinkStart = 0;
  const calls = [];
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let cut;
    while ((cut = buf.indexOf('\n\n')) >= 0) {
      const event = buf.slice(0, cut);
      buf = buf.slice(cut + 2);
      for (const line of event.split('\n')) {
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        let j;
        try { j = JSON.parse(data); } catch { continue; }
        if (j.error) { am.error = j.error.message || 'the stream failed'; continue; }
        if (j.usage) usage = j.usage;
        const ch = (j.choices || [])[0];
        if (!ch) continue;
        const d = ch.delta || {};
        if (d.content || d.reasoning_content || d.reasoning) {

          last = now;

          if (d.content) {

        for (const tc of d.tool_calls || []) {
          const c = calls[tc.index || 0] || (calls[tc.index || 0] = { id: '', name: '', args: '' });
          if (tc.id) c.id = tc.id;
          if (tc.function && tc.function.name) c.name += tc.function.name;
          if (tc.function && tc.function.arguments) c.args += tc.function.arguments;

}

const WORKLET = `
class Pcm24k extends AudioWorkletProcessor {
  constructor() { super(); this.step = sampleRate / ${RATE}; this.pos = 0; this.last = 0; this.fresh(); }
  fresh() { this.buf = new ArrayBuffer(${CHUNK * 2}); this.view = new DataView(this.buf); this.n = 0; }
  process(inputs) {
    const chans = inputs[0];
    if (!chans || !chans.length) return true;
    const len = chans[0].length;
    const mono = new Float32Array(len);
    for (const c of chans) for (let i = 0; i < len; i++) mono[i] += c[i] / chans.length;
    while (this.pos < len) {
      const i = Math.floor(this.pos);
      const a = i === 0 ? this.last : mono[i - 1];
      const v = Math.max(-1, Math.min(1, a + (mono[i] - a) * (this.pos - i)));
      this.view.setInt16(this.n * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
      if (++this.n === ${CHUNK}) { this.port.postMessage(this.buf, [this.buf]); this.fresh(); }
      this.pos += this.step;
    }
    this.pos -= len;
    this.last = mono[len - 1];
    return true;
  }
}
registerProcessor('pcm24k', Pcm24k);
`;

  thinking: ['Thinking…', 'Tap the orb to stop'], speaking: ['Speaking', 'Tap the orb or just talk to interrupt'],
  muted: ['Muted', 'Tap Unmute to talk'], ptt: ['Ready', 'Hold the button while you talk'], talking: ['Listening…', 'Release to send'],
};
function renderVoice() {
  const s = voiceState();
  window.jarvis.ui.voiceState = s;
  $('mic').dataset.on = V.ws ? '1' : '';
  $('mic').setAttribute('aria-label', V.ws ? 'Open voice mode' : 'Start voice mode');
  $('vbar').hidden = !V.ws || V.open;
  $('vbarText').textContent = `Voice on · ${STATE_TEXT[s][0].toLowerCase()}`;
  $('text').placeholder = V.ws ? 'Type, and hear the reply' : 'Message Jarvis';
  if (!V.open) return;
  const orb = $('orb');
  if (orb.dataset.state !== s) orb.dataset.state = s;
  $('vmState').textContent = STATE_TEXT[s][0];
  if (!/^Keep holding/.test($('vmHint').textContent) || s !== 'ptt') $('vmHint').textContent = STATE_TEXT[s][1];
  orb.setAttribute('aria-label', s === 'speaking' || s === 'thinking' ? 'Interrupt' : s === 'muted' ? 'Unmute' : s === 'listening' ? 'Mute' : 'Voice');
  $('vmYou').textContent = V.lastYou ? `“${V.lastYou}”` : '';
  $('vmBot').textContent = V.lastBot;
  const v = lastLat.voice;
  $('vmLat').textContent = v ? `Last reply: first audio after ${(v.firstAudio / 1000).toFixed(2)} s${v.stages ? ' · ' + v.stages : ''}` : '';
  for (const b of document.querySelectorAll('.seg [data-mode]')) b.setAttribute('aria-checked', String(b.dataset.mode === S.mode));
  const talk = $('talk');
  const ts = S.mode === 'ptt' ? (V.holding ? 'talking' : 'ptt') : V.muted ? 'muted' : 'listening';
  talk.dataset.s = ts;
  talk.querySelector('svg').outerHTML = ts === 'muted' ? I.micOff : I.mic;
  $('talkLbl').textContent = ts === 'ptt' ? 'Hold to talk' : ts === 'talking' ? 'Listening…' : ts === 'muted' ? 'Muted' : 'Listening';
  $('talkSub').textContent = ts === 'ptt' ? 'Release to send' : ts === 'talking' ? 'Release to send' : ts === 'muted' ? 'Tap to unmute' : 'Tap to mute';
  talk.setAttribute('aria-label', ts === 'ptt' || ts === 'talking' ? 'Hold to talk' : ts === 'muted' ? 'Unmute the microphone' : 'Mute the microphone');
  $('wave').classList.toggle('live', s === 'speaking' || s === 'hearing' || s === 'talking' || s === 'listening');
}
function showVoice(open) {
  V.open = open;
  document.body.classList.toggle('voice-open', open);
  $('vm').hidden = !open;
  document.querySelector('.app').inert = open;
  if (open) { renderVoice(); renderVoiceName(); animate(); $('talk').focus({ preventScroll: true }); }
  else { renderVoice(); $('mic').focus({ preventScroll: true }); }
}
const BARS = 44;
$('wave').append(...Array.from({ length: BARS }, () => document.createElement('i')));
let lvl = 0, raf = 0;
function playbackLevel() {
  if (!V.an) return 0;
  const a = new Float32Array(V.an.fftSize);
  V.an.getFloatTimeDomainData(a);
  let s = 0;
  for (const x of a) s += x * x;
  return Math.sqrt(s / a.length);
}
// The orb and Sidebud's 44-bar wave follow the live audio: the reply's level while speaking, the microphone's otherwise.
function animate() {
  cancelAnimationFrame(raf);
  if (!V.open) return;
  const s = voiceState();
  const t = performance.now() / 1000;
  let target = 0;
  if (s === 'speaking') target = Math.min(1, playbackLevel() * 9);
  else if (s === 'hearing' || s === 'talking') target = Math.min(1, V.micLevel * 14);
  else if (s === 'listening') target = Math.min(.6, V.micLevel * 10);
  else if (s === 'thinking') target = .25 + .12 * Math.sin(t * 3);
  lvl += (target - lvl) * .22;
  $('orb').style.setProperty('--lvl', reduceMotion.matches ? '0' : lvl.toFixed(3));
  const swing = reduceMotion.matches ? 0 : s === 'thinking' ? .3 : s === 'off' || s === 'connecting' || s === 'muted' ? .14 : .55;
  const speed = s === 'speaking' || s === 'hearing' ? 7 : s === 'thinking' ? 4.5 : 2;
  const bars = $('wave').children;
  for (let i = 0; i < BARS; i++) {
    const x = i / (BARS - 1);
    const env = Math.pow(Math.sin(Math.PI * x), 1.6);
    const ripple = .55 + .45 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * .6));
    const wob = 1 - swing + swing * Math.abs(Math.sin(i * .45 + t * speed));
    const h = Math.max(.06, env * ripple * (.12 + lvl * .88) * wob);
    bars[i].style.transform = `scaleY(${h.toFixed(3)})`;
    bars[i].style.opacity = (.35 + .6 * env).toFixed(2);
  }
  raf = requestAnimationFrame(animate);
}

// ---------------------------------------------------------------- controls and settings

function renderControls() {
  const sending = !!busy;
  const send = $('send');
  send.innerHTML = sending ? I.stop : I.send;
  send.setAttribute('aria-label', sending ? 'Stop the reply' : 'Send');
  send.disabled = !sending && !$('text').value.trim();
  $('think').setAttribute('aria-pressed', String(S.think));
  $('thinkSw').checked = S.think;
}
function onInput() {
  const t = $('text');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 200) + 'px';
  renderControls();
}
function sensFromThreshold() { return Math.round((0.8 - S.threshold) / 0.6 * 100); }
function openDrawer(section) {
  $('chatmodel').value = S.chatModel;
  $('thinkSw').checked = S.think;
  $('tools').checked = S.tools;
  $('maxtok').value = S.maxTokens || '';
  $('instructions').value = S.instructions;
  $('sens').value = Math.max(0, Math.min(100, sensFromThreshold()));
  $('silence').value = S.silence;
  $('silenceV').textContent = `${(S.silence / 1000).toFixed(2)} s`;
  $('gate').checked = S.gate;
  $('key').value = S.key;
  $('logn').value = S.logN;
  renderVoices();
  $('drawer').showModal();
  if (section) setTimeout(() => $(section).scrollIntoView({ block: 'start' }), 30);
}
const live = (id, fn) => $(id).addEventListener('input', () => { fn($(id)); saveSettings(); });
$('chatmodel').addEventListener('change', () => { S.chatModel = $('chatmodel').value; saveSettings(); sessionUpdate(); });
$('thinkSw').addEventListener('change', () => { S.think = $('thinkSw').checked; saveSettings(); renderControls(); });
$('tools').addEventListener('change', () => { S.tools = $('tools').checked; saveSettings(); });
$('gate').addEventListener('change', () => { S.gate = $('gate').checked; saveSettings(); });
live('maxtok', e => { S.maxTokens = Number(e.value) || 0; });
live('instructions', e => { S.instructions = e.value; });
live('sens', e => { S.threshold = Math.round((0.8 - Number(e.value) / 100 * 0.6) * 100) / 100; });
live('silence', e => { S.silence = Number(e.value) || 500; $('silenceV').textContent = `${(S.silence / 1000).toFixed(2)} s`; });
live('key', e => { S.key = e.value.trim(); });
live('logn', e => { S.logN = Number(e.value) || 300; });
$('sens').addEventListener('change', sessionUpdate);
$('silence').addEventListener('change', sessionUpdate);
$('vsearch').addEventListener('input', renderVoices);
$('drawerClose').onclick = () => $('drawer').close();
$('drawer').addEventListener('click', e => { if (e.target === $('drawer')) $('drawer').close(); });
$('copylog2').onclick = copyLog;
$('wipeAll').onclick = () => {
  if (!confirm('Delete every conversation kept in this browser?')) return;
  convs = [];
  store.set('convs', convs);
  $('drawer').close();
  openConv(newConv().id);
};
$('gear').onclick = () => openDrawer();
$('sideSettings').onclick = () => { closeSide(); openDrawer(); };
$('vmVoice').onclick = () => openDrawer('voiceSect');
$('statusPill').onclick = () => togglePop();
document.addEventListener('click', e => { if (!$('statusPop').hidden && !e.target.closest('#statusPop, #statusPill')) togglePop(false); });
$('menu').onclick = () => ($('app').classList.contains('side-open') ? closeSide() : openSide());
$('scrim').onclick = closeSide;
$('newChat').onclick = () => { if (busy) return; const empty = convs.find(c => !c.msgs.length); openConv((empty || newConv()).id); closeSide(); $('text').focus(); };
$('send').onclick = () => (busy ? busy.ctl.abort() : sendText());
$('text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendText(); } });
$('text').addEventListener('input', onInput);
$('think').onclick = () => { S.think = !S.think; saveSettings(); renderControls(); };
$('attach').onclick = () => toast('Attachments are not available yet');
$('mic').onclick = () => { if (!V.ws) voiceStart(); showVoice(true); };
$('vbarOpen').onclick = () => showVoice(true);
$('vbarEnd').onclick = () => voiceStop();
$('vmMin').onclick = () => showVoice(false);
$('vmEnd').onclick = () => voiceStop();
$('orb').onclick = () => {
  const s = voiceState();
  if (s === 'speaking' || s === 'thinking') return bargeIn(true);
  if (s === 'listening' || s === 'muted') { V.muted = !V.muted; if (V.muted) vsend({ type: 'input_audio_buffer.clear' }); renderVoice(); }
};
for (const b of document.querySelectorAll('.seg [data-mode]')) b.onclick = () => {
  S.mode = b.dataset.mode;
  saveSettings();
  V.holding = false;
  sessionUpdate();
  renderVoice();
};
// The big button: hands-free, a tap mutes and unmutes; push to talk, hold to talk.
$('talk').addEventListener('contextmenu', e => e.preventDefault());
$('talk').addEventListener('pointerdown', e => {
  if (S.mode !== 'ptt' || !V.ws) return;
  e.preventDefault();
  try { $('talk').setPointerCapture(e.pointerId); } catch {}
  pttDown();
});
for (const t of ['pointerup', 'pointercancel']) $('talk').addEventListener(t, () => { if (S.mode === 'ptt') pttUp(); });
$('talk').addEventListener('click', () => {
  if (S.mode === 'ptt' || !V.ws) return;
  V.muted = !V.muted;
  if (V.muted) vsend({ type: 'input_audio_buffer.clear' });
  renderVoice();
});
$('talk').addEventListener('keydown', e => { if (S.mode === 'ptt' && (e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); pttDown(); } });
$('talk').addEventListener('keyup', e => { if (S.mode === 'ptt' && (e.key === ' ' || e.key === 'Enter')) pttUp(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('statusPop').hidden) togglePop(false);
  else if ($('app').classList.contains('side-open')) closeSide();
  else if (V.open && !$('drawer').open) showVoice(false);
});
$('lbClose').onclick = () => $('lightbox').close();
$('lightbox').addEventListener('click', e => { if (e.target === $('lightbox') || e.target === $('lbImg')) $('lightbox').close(); });
document.addEventListener('pointerup', () => { if (V.ctx && V.ctx.state === 'suspended') V.ctx.resume(); });
if (navigator.audioSession) try { navigator.audioSession.type = 'play-and-record'; } catch {} // iOS: audible with the ringer off
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { pollTools(); if (V.ws && !V.lock && navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { V.lock = l; }).catch(() => {}); }
});
// The composer stays above the on-screen keyboard: the app is as tall as the visual viewport.
if (window.visualViewport) {
  const fit = () => { document.documentElement.style.setProperty('--app-h', visualViewport.height + 'px'); if (visualViewport.offsetTop) window.scrollTo(0, 0); };
  visualViewport.addEventListener('resize', fit);
  visualViewport.addEventListener('scroll', fit);
  fit();
}

// A test or another script can see the state without scraping the page.
window.jarvis = { get conversation() { return cur; }, get voice() { return { connected: !!V.ws, live: V.live.length, thinking: V.thinking, lead: V.lead, gaps: Object.fromEntries(V.gaps) }; },
                  output: outputStats, recordOutput: false,
                  get engine() { return engine(); },
                  dropVoiceSocket: () => { if (V.ws && V.ws.readyState === WebSocket.OPEN) V.ws.close(4000, 'test: dropped'); }, get arrivals() { return V.rec ? V.rec.arrivals : null; },
                  debug, settings: S, ui: { voiceState: 'off' }, ready: false };

openConv(store.get('current', null) || ((convs.find(c => c.msgs.length) || {}).id));
renderControls();
renderVoice();
loadModels().then(pollTools);
setInterval(pollTools, 4000);
setInterval(renderSide, 60000);
</script>
