<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#161618">
<title>Jarvis · LocalRouter</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f5; --fg: #1d1d1f; --muted: #6e6e73; --panel: #fff; --line: #d8d8dc;
          --user: #e3ecf8; --bot: #ececee; --accent: #2d6cdf; --err: #c62828; --ok: #2e9e5b; --warn: #d49b1f;
          --live: #b05ad6; --code: #f0f0f2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --fg: #e8e8ea; --muted: #9a9aa0; --panel: #1f1f22; --line: #343438;
            --user: #22344f; --bot: #232327; --accent: #6b9cff; --err: #ff6b6b; --code: #2b2b30; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif;
         -webkit-text-size-adjust: 100%; }
  main { max-width: 860px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  h1 { font-size: 17px; margin: 0; }
  header select { flex: 1 1 auto; min-width: 0; max-width: 360px; }
  select { min-width: 0; text-overflow: ellipsis; }
  .grow { flex: 1; }
  button, input, select, textarea { font: inherit; color: inherit; background: var(--panel);
                                    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; touch-action: manipulation; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.on { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .icon { padding: 6px 9px; }
  #strip { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 6px; font-size: 12px; color: var(--muted); }
  @media (max-width: 640px) { #strip { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .chip::before { content: "\25CF"; margin-right: 4px; color: var(--line); }
  .chip[data-s="ready"]::before { color: var(--ok); }
  .chip[data-s="busy"]::before { color: var(--warn); }
  .chip[data-s="loading"]::before { color: var(--accent); }
  .chip[data-s="failed"]::before { color: var(--err); }
  .chip.plain::before { content: none; }
  .chip.lat { color: var(--fg); }
  .note { margin: 0 12px 6px; border: 1px solid var(--err); color: var(--err); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 8px 12px 12px;
         overscroll-behavior: contain; }
  .msg { max-width: 88%; padding: 8px 12px; border-radius: 14px; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: var(--bot); }
  .msg.partial { color: var(--muted); font-style: italic; }
  .msg.tool { align-self: flex-start; background: none; padding: 0; max-width: 100%; }
  .meta { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  .msg.user .meta { text-align: right; }
  .sys { align-self: center; color: var(--muted); font-size: 13px; text-align: center; max-width: 90%; }
  .sys.error { color: var(--err); }
  .body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
  .body p, .body ul, .body ol, .body pre, .body table, .body blockquote { margin: .45em 0; }
  .body ul, .body ol { padding-left: 1.4em; }
  .body h1, .body h2, .body h3, .body h4 { font-size: 1.05em; margin: .6em 0 .3em; }
  .body code { background: var(--code); border-radius: 4px; padding: 0 4px; font: 13px ui-monospace, monospace; }
  .body pre { background: var(--code); border-radius: 8px; padding: 8px 10px; overflow-x: auto; }
  .body pre code { padding: 0; background: none; }
  .body table { border-collapse: collapse; display: block; overflow-x: auto; }
  .body th, .body td { border: 1px solid var(--line); padding: 3px 8px; }
  .body blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
  .body a { color: var(--accent); }
  .body img { max-width: 100%; border-radius: 8px; }
  details.think { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
  details.think summary { cursor: pointer; }
  details.think div { white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 8px; margin-top: 4px; }
  .media { display: flex; gap: 8px; flex-wrap: wrap; }
  .media img { width: min(320px, 70vw); border-radius: 10px; border: 1px solid var(--line); display: block; }
  .media video { width: min(420px, 85vw); border-radius: 10px; display: block; }
  .tag { color: var(--muted); font-size: 12px; }
  footer { padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
           display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  #text { flex: 1; resize: none; min-height: 40px; max-height: 160px; line-height: 1.4; }
  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .bar select { padding: 4px 8px; font-size: 13px; max-width: 42vw; }
  #mic { width: 56px; height: 56px; border-radius: 50%; padding: 0; font-size: 22px; flex: none; position: relative;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #mic::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid var(--ok);
                opacity: 0; transform: scale(calc(1 + var(--lvl, 0) * .35)); transition: transform 80ms; }
  #mic[data-s="listening"]::after, #mic[data-s="talking"]::after { opacity: .9; }
  #mic[data-s="talking"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  #mic[data-s="muted"] { color: var(--muted); }
  #mic[data-s="connecting"] { opacity: .6; }
  #vstate { color: var(--muted); min-width: 7em; }
  #vstate[data-s="speaking"] { color: var(--live); }
  #vstate[data-s="thinking"] { color: var(--warn); }
  #vstate[data-s="you"] { color: var(--accent); }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--fg);
           width: min(560px, 94vw); padding: 14px 16px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  label.wide { grid-column: 1 / -1; }
  label.check { flex-direction: row; align-items: center; gap: 8px; }
  dialog textarea { min-height: 70px; resize: vertical; }
  dialog .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Jarvis</h1>
    <select id="conv" aria-label="Conversation"></select>
    <button id="new" class="icon" title="New conversation">＋</button>
    <span class="grow"></span>
    <button id="copylog" class="icon" title="Copy the debug log">Copy log</button>
    <button id="gear" class="icon" title="Settings" aria-label="Settings">⚙</button>
  </header>
  <div id="strip" aria-live="off"></div>
  <div id="insecure" class="note" hidden>This page is not a secure context, so the browser will not open the
    microphone. Use https, or http://127.0.0.1 on this machine. Chat still works.</div>
  <div id="log" aria-live="polite"></div>
  <footer>
    <div class="bar">
      <button id="think" title="Let the model reason before it answers">Reasoning: off</button>
      <button id="regen" title="Answer the last message again">Regenerate</button>
      <span class="grow"></span>
      <label class="check" title="Voice turns: the server hears when you stop, or you hold the mic"><select id="mode">
        <option value="vad">Hands-free</option><option value="ptt">Push to talk</option></select></label>
      <select id="speech" title="Speech model" aria-label="Speech model"></select>
      <select id="voice" title="Voice" aria-label="Voice"></select>
    </div>
    <div class="row">
      <button id="mic" title="Voice" aria-label="Voice">🎤</button>
      <textarea id="text" rows="1" placeholder="Message" autocomplete="off"></textarea>
      <button id="send" class="primary">Send</button>
    </div>
    <div class="bar"><span id="vstate" data-s="off">voice off</span><button id="hush" hidden>■ Stop speaking</button>
      <button id="hangup" hidden>End voice</button></div>
  </footer>
</main>
<dialog id="settings">
  <form method="dialog">
    <div class="grid">
      <label>Chat model <select id="chatmodel"></select></label>
      <label>Max reply tokens <input id="maxtok" type="number" min="16" max="32768" step="16" placeholder="model default"></label>
      <label>Silence that ends a turn (ms) <input id="silence" type="number" min="100" max="5000" step="50"></label>
      <label>VAD threshold <input id="threshold" type="number" min="0" max="1" step="0.05"></label>
      <label class="check"><input id="tools" type="checkbox"> Offer image and video tools</label>
      <label class="check"><input id="gate" type="checkbox"> Echo gate (hands-free, while it speaks)</label>
      <label>Debug log lines to copy <input id="logn" type="number" min="20" max="2000" step="10"></label>
      <label>API key <input id="key" type="password" autocomplete="off" placeholder="none"></label>
      <label class="wide">Instructions (system prompt) <textarea id="instructions" placeholder="the default"></textarea></label>
    </div>
    <div class="acts">
      <button type="button" id="wipe">Delete this conversation</button>
      <span class="grow"></span>
      <button value="ok" class="primary">Done</button>
    </div>
  </form>
</dialog>
<script>
'use strict';
const $ = id => document.getElementById(id);
const RATE = 24000;
const CHUNK = 960; // 40 ms of 24 kHz samples a microphone message
const LOUD = 250 / 32768; // a reply sample above this is audible (about -42 dBFS), as the daemon's timing counts it
const DEFAULT_SYSTEM = "You are Jarvis, a helpful assistant running on the user's own machine. Be concise.";
const CHAT_TOOLS = {
  image: { type: 'function', function: { name: 'generate_image', description: 'Make a picture on this machine from a detailed description. The user sees it inline.',
    parameters: { type: 'object', properties: { prompt: { type: 'string', description: 'what to draw, in detail' },
      size: { type: 'string', description: 'WIDTHxHEIGHT in multiples of 16, e.g. 1024x1024 (default) or 1344x768' } }, required: ['prompt'] } } },
  video: { type: 'function', function: { name: 'generate_video', description: 'Make a short video clip with sound on this machine. It takes minutes.',
    parameters: { type: 'object', properties: { prompt: { type: 'string', description: 'what happens, in detail' },
      seconds: { type: 'integer', description: 'length, 1 to 20 (default 5)' } }, required: ['prompt'] } } },
};

// ---------------------------------------------------------------- storage, settings, debug log

const store = {
  get(k, d) { try { const v = localStorage.getItem('jarvis.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) {
    try { localStorage.setItem('jarvis.' + k, JSON.stringify(v)); } catch (e) {
      if (k === 'convs' && convs.length > 1) { convs.sort((a, b) => b.updated - a.updated).pop(); store.set(k, convs); }
      else dbg('storage', { error: e.message });
    }
  },
};
const S = Object.assign({ chatModel: '', think: false, speechModel: '', voice: '', mode: 'vad', silence: 500, threshold: 0.5,
  tools: true, gate: true, logN: 300, key: '', instructions: '', maxTokens: 0 }, store.get('settings', {}));
const saveSettings = () => store.set('settings', S);

const debug = [];
function dbg(kind, data) {
  debug.push({ t: Math.round(performance.now()), at: new Date().toISOString(), kind, ...data });
  if (debug.length > 2000) debug.splice(0, debug.length - 2000);
}
window.addEventListener('error', e => dbg('page.error', { message: e.message, at: `${e.filename}:${e.lineno}` }));
window.addEventListener('unhandledrejection', e => dbg('page.rejection', { message: String(e.reason && e.reason.message || e.reason) }));

// A key in the URL fragment (#key=...) is taken once and removed from the address bar.
(function keyFromFragment() {
  const m = /(?:^|[#&])key=([^&]+)/.exec(location.hash);
  if (!m) return;
  S.key = decodeURIComponent(m[1]);
  saveSettings();
  history.replaceState(null, '', location.pathname + location.search);
})();

// ---------------------------------------------------------------- conversations

let convs = store.get('convs', []);
let cur = null;
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function newConv() {
  cur = { id: uid('c'), title: 'New conversation', updated: Date.now(), msgs: [] };
  convs.unshift(cur);
  store.set('current', cur.id);
  return cur;
}
function saveConv() {
  if (!cur) return;
  cur.updated = Date.now();
  const first = cur.msgs.find(m => m.role === 'user' && m.text);
  if (first) cur.title = first.text.slice(0, 48);
  if (!convs.includes(cur)) convs.unshift(cur);
  store.set('convs', convs);
  fillConvs();
}
function fillConvs() {
  $('conv').replaceChildren(...convs.slice().sort((a, b) => b.updated - a.updated).map(c =>
    Object.assign(document.createElement('option'), { value: c.id, textContent: c.title || 'Untitled', selected: c === cur })));
}
function openConv(id) {
  if (V.ws) voiceStop(); // the voice session holds the other conversation's history
  cur = convs.find(c => c.id === id) || newConv();
  store.set('current', cur.id);
  els.clear();
  $('log').replaceChildren();
  for (const m of cur.msgs) draw(m);
  fillConvs();
  scrollDown(true);
}
const addMsg = m => { m.id = m.id || uid('m'); m.at = m.at || Date.now(); cur.msgs.push(m); draw(m); scrollDown(); return m; };

// ---------------------------------------------------------------- markdown (escaped first; links http(s) or same-origin only)

const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function href(u) {
  try {
    const url = new URL(u, location.href);
    if (url.origin === location.origin || url.pathname.startsWith('/v1/files/') && /^https?:$/.test(url.protocol)) return url.pathname + url.search;
    return /^https?:$/.test(url.protocol) ? url.href : null;
  } catch { return null; }
}
function inline(s) {
  return s.split(/(`[^`\n]+`)/).map((part, i) => {
    if (i % 2) return `<code>${esc(part.slice(1, -1))}</code>`;
    const keep = [];
    let t = part.replace(/!?\[([^\]\n]*)\]\(([^)\s]+)\)/g, (all, label, u) => {
      const h = href(u);
      if (!h) return all;
      keep.push(all[0] === '!' ? `<img src="${esc(h)}" alt="${esc(label)}">` : `<a href="${esc(h)}" target="_blank" rel="noopener">${esc(label)}</a>`);
      return `\u0000${keep.length - 1}\u0000`;
    });
    t = esc(t)
      .replace(/(^|[\s(])(https?:\/\/[^\s<>()]+[^\s<>().,;:!?'"])/g, (all, pre, u) => `${pre}<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
      .replace(/\*\*([^*\n][^\n]*?)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_\n]+)__/g, '<strong>$1</strong>')
      .replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/(^|[^\w])_([^_\s][^_\n]*?)_(?!\w)/g, '$1<em>$2</em>')
      .replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
    return t.replace(/\u0000(\d+)\u0000/g, (_, n) => keep[+n]);
  }).join('');
}
function md(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  const out = [];
  const isList = l => /^\s*([-*+•]|\d+[.)])\s+/.test(l);
  const isRule = l => /^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l);
  const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => inline(c.trim()));
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if ((m = /^\s*(```|~~~)\s*([\w+-]*)/.exec(l))) {
      const body = [];
      for (i++; i < lines.length && !lines[i].trim().startsWith(m[1]); i++) body.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(body.join('\n'))}</code></pre>`);
    } else if ((m = /^\s{0,3}(#{1,6})\s+(.*)$/.exec(l))) {
      const n = Math.min(m[1].length + 1, 4);
      out.push(`<h${n}>${inline(m[2].replace(/\s#+$/, ''))}</h${n}>`);
      i++;
    } else if (isRule(l)) {
      out.push('<hr>');
      i++;
    } else if (/^\s*>/.test(l)) {
      const q = [];
      for (; i < lines.length && /^\s*>/.test(lines[i]); i++) q.push(lines[i].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${md(q.join('\n'))}</blockquote>`);
    } else if (l.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = cells(l);
      const rows = [];
      for (i += 2; i < lines.length && lines[i].includes('|') && lines[i].trim(); i++) rows.push(cells(lines[i]));
      out.push(`<table><thead><tr>${head.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${
        rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
    } else if (isList(l)) {
      const ordered = /^\s*\d+[.)]/.test(l);
      const items = [];
      for (; i < lines.length && (isList(lines[i]) || (/^\s+\S/.test(lines[i]) && items.length)); i++) {
        if (isList(lines[i])) items.push(lines[i].replace(/^\s*([-*+•]|\d+[.)])\s+/, ''));
        else items[items.length - 1] += ' ' + lines[i].trim();
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}>${items.map(x => `<li>${inline(x)}</li>`).join('')}</${tag}>`);
    } else if (!l.trim()) {
      i++;
    } else {
      const p = [];
      for (; i < lines.length && lines[i].trim() && !/^\s*(```|~~~|#{1,6}\s|>)/.test(lines[i]) && !isList(lines[i]) && !isRule(lines[i]); i++) p.push(lines[i]);
      if (!p.length) p.push(lines[i++]);
      out.push(`<p>${p.map(inline).join('<br>')}</p>`);
    }
  }
  return out.join('');
}

// A reply may carry its reasoning inline: <think>…</think>, or a stray </think> after reasoning written as plain text.
function splitThink(text) {
  const open = text.indexOf('<think>');
  const close = text.indexOf('</think>');
  if (open >= 0 && (close < 0 || close > open)) {
    const end = close < 0 ? text.length : close;
    return { reasoning: text.slice(open + 7, end), answer: (text.slice(0, open) + (close < 0 ? '' : text.slice(close + 8))).trim() };
  }
  if (close >= 0) return { reasoning: text.slice(0, close), answer: text.slice(close + 8).trim() };
  return { reasoning: '', answer: text };
}

// ---------------------------------------------------------------- drawing messages

const els = new Map();
let drawQueued = new Set(), drawRaf = 0;
function draw(m) {
  drawQueued.add(m);
  if (!drawRaf) drawRaf = requestAnimationFrame(() => { drawRaf = 0; const q = drawQueued; drawQueued = new Set(); q.forEach(drawNow); scrollDown(); });
}
function drawNow(m) {
  let el = els.get(m.id);
  if (m.gone) { if (el) el.remove(); els.delete(m.id); return; }
  if (!el) {
    el = document.createElement('div');
    $('log').append(el);
    els.set(m.id, el);
  }
  if (m.role === 'sys') {
    el.className = 'sys' + (m.error ? ' error' : '');
    el.textContent = m.text;
    return;
  }
  if (m.role === 'tool') {
    el.className = 'msg tool';
    el.replaceChildren();
    if (m.text && !(m.media && m.media.length)) el.append(Object.assign(document.createElement('div'), { className: 'sys' + (m.error ? ' error' : ''), textContent: m.text }));
    if (m.media && m.media.length) el.append(mediaBox(m.media));
    return;
  }
  el.className = `msg ${m.role}` + (m.partial ? ' partial' : '');
  el.hidden = m.role === 'assistant' && !m.streaming && !m.text && !m.reasoning && !m.error && !m.interrupted && !!(m.calls && m.calls.length);
  el.dataset.via = m.via || 'text';
  el.replaceChildren();
  if (m.role === 'user') {
    el.append(document.createTextNode(m.text || (m.partial ? '…' : '')));
  } else {
    const { reasoning, answer } = splitThink(m.text || '');
    const why = (m.reasoning || '') + reasoning;
    if (why.trim()) {
      const d = Object.assign(document.createElement('details'), { className: 'think', open: !answer && m.streaming });
      d.append(Object.assign(document.createElement('summary'), { textContent: m.streaming && !answer ? 'Thinking…' : 'Reasoning' }),
               Object.assign(document.createElement('div'), { textContent: why.trim() }));
      el.append(d);
    }
    const body = Object.assign(document.createElement('div'), { className: 'body' });
    body.innerHTML = md(answer) || (m.streaming && !why ? '<span class="tag">…</span>' : '');
    el.append(body);
  }
  const meta = metaText(m);
  if (meta) el.append(Object.assign(document.createElement('div'), { className: 'meta', textContent: meta }));
}
function metaText(m) {
  const bits = [];
  if (m.via === 'voice') bits.push('🎤');
  if (m.interrupted) bits.push('interrupted');
  if (m.error) bits.push(m.error);
  const l = m.lat || {};
  if (l.firstAudio != null) bits.push(`speech end → first audio ${l.firstAudio} ms`);
  if (l.firstText != null && m.via === 'voice') bits.push(`first text ${l.firstText} ms`);
  if (l.stages) bits.push(l.stages);
  if (l.ttft != null) bits.push(`first token ${l.ttft} ms`);

  const level = rms16(pcm);
  $('mic').style.setProperty('--lvl', Math.min(level * 12, 1).toFixed(2));
  if (level > 0.02) V.lastLoudMic = performance.now();
  if (S.mode === 'ptt') {
    if (V.holding || performance.now() < V.tailUntil) sendPcm(pcm);
    return;
  }
  if (V.muted) return;
  // Echo gate: while the reply plays, a quiet chunk is sent as silence (it is most likely the reply's own echo), until
  // three loud ones in a row say someone is talking over it; then the held ones go too, so no word is lost.
  const g = V.gate;
  if (S.gate && V.live.length && performance.now() > g.openUntil) {
    const loud = level > Math.max(0.03, 1.5 * V.playRms);
    g.held.push(pcm);
    if (g.held.length > 6) g.held.shift();
    g.loud = loud ? g.loud + 1 : 0;
    if (g.loud >= 3) { g.openUntil = performance.now() + 700; g.held.forEach(sendPcm); g.held = []; g.loud = 0; dbg('voice.gate', { opened: level.toFixed(3) }); }
    else sendPcm(new Int16Array(pcm.length));
    return;
  }
  if (g.held.length) g.held = [];
  sendPcm(pcm);
}
function sendPcm(pcm) { vsend({ type: 'input_audio_buffer.append', audio: toB64(new Uint8Array(pcm.buffer, pcm.byteOffset, pcm.byteLength)) }); }

// Push to talk: pressing interrupts the reply and starts a turn; letting go (plus 200 ms of tail) commits it.
function pttDown() {
  if (!V.ws) return;
  bargeIn(true);
  vsend({ type: 'input_audio_buffer.clear' });
  V.holding = true;
  V.holdStart = performance.now();
  V.userSpeaking = true;
  renderVoice();
}
function pttUp() {
  if (!V.holding) return;
  V.holding = false;
  V.userSpeaking = false;
  const held = performance.now() - V.holdStart;
  V.tailUntil = performance.now() + 200;
  V.turnEnd = performance.now();
  setTimeout(() => {
    if (held < 250) { vsend({ type: 'input_audio_buffer.clear' }); note('hold the mic while you talk'); return renderVoice(); }
    vsend({ type: 'input_audio_buffer.commit' });
    vsend({ type: 'response.create' });
    V.pendingTurn = { end: V.turnEnd };
    V.thinking = true;
    renderVoice();
  }, 220);
  renderVoice();
}

function silence() {
  for (const e of V.live) { e.src.onended = null; try { e.src.stop(); } catch {} }
  V.live = [];
  V.nextTime = 0;
}
function playedMs(item, now) {
  let ms = V.doneMs.get(item) || 0;
  for (const e of V.live) if (e.item === item) ms += Math.min(Math.max(now - e.start, 0), e.dur) * 1000;
  return ms;
}
// Stops the reply's audio now, tells the server how much of it was heard, and (cancel) ends the response.
function bargeIn(cancel) {
  if (V.live.length && V.ctx) {
    const now = V.ctx.currentTime;
    const item = (V.live.find(e => e.start <= now) || V.live[0]).item;
    const ms = Math.floor(playedMs(item, now));
    silence();
    V.cut.add(item);
    vsend({ type: 'conversation.item.truncate', item_id: item, content_index: 0, audio_end_ms: ms });
    const m = V.byItem.get(item);
    if (m) { m.interrupted = true; draw(m); }
  }
  if (cancel && V.resp) vsend({ type: 'response.cancel' });
  renderVoice();
}
function play(item, b64) {
  if (!V.ctx || V.cut.has(item)) return;
  const bytes = fromB64(b64);
  const n = bytes.length >> 1;
  if (!n) return;
  const view = new DataView(bytes.buffer);
  const buf = V.ctx.createBuffer(1, n, RATE);
  const ch = buf.getChannelData(0);
  let acc = 0, loudAt = -1;
  for (let i = 0; i < n; i++) {
    const x = view.getInt16(i * 2, true) / 32768;
    ch[i] = x;
    acc += x * x;
    if (loudAt < 0 && Math.abs(x) > LOUD) loudAt = i;
  }
  const src = V.ctx.createBufferSource();
  src.buffer = buf;
  src.connect(V.ctx.destination);
  const now = V.ctx.currentTime;
  // A reply's first audio starts at once (50 ms to schedule it). Later audio that ran dry restarts with a lead that
  // grows by how late it was (up to 0.5 s) and shrinks after each reply, so gaps inside a sentence stay rare.
  const first = !V.doneMs.has(item) && !V.live.some(x => x.item === item);
  if (!first && !V.live.length && V.nextTime && V.nextTime < now) V.lead = Math.min(0.5, V.lead + (now - V.nextTime));
  const start = Math.max(now + (V.live.length ? 0 : first ? 0.05 : V.lead), V.nextTime);
  src.start(start);
  V.nextTime = start + buf.duration;
  const e = { src, item, start, dur: buf.duration, rms: Math.sqrt(acc / n) };
  V.live.push(e);
  V.playRms = e.rms;
  src.onended = () => {
    const i = V.live.indexOf(e);
    if (i >= 0) V.live.splice(i, 1);
    V.doneMs.set(item, (V.doneMs.get(item) || 0) + e.dur * 1000);
    if (!V.live.length) V.playRms = 0;
    renderVoice();
  };
  const m = V.byItem.get(item);
  if (m && loudAt >= 0 && m.lat && m.lat.end && m.lat.firstAudio == null) {
    const heardAt = performance.now() + (start - now + loudAt / RATE) * 1000;
    m.lat.firstAudio = Math.round(heardAt - m.lat.end);
    lastLat.voice = `speech end → first audio ${m.lat.firstAudio} ms`;
    dbg('voice.first_audio', { item, ms: m.lat.firstAudio });
    draw(m);
    renderStrip();
  }
}

function userMsg(itemId) {
  let m = V.byItem.get(itemId);
  if (!m) { m = addMsg({ role: 'user', text: '', partial: true, via: 'voice' }); V.byItem.set(itemId, m); }
  return m;
}
function botMsg(itemId) {
  let m = V.byItem.get(itemId);
  if (!m) {
    const turn = V.pendingTurn;
    V.pendingTurn = null;
    m = addMsg({ role: 'assistant', text: '', streaming: true, via: 'voice', lat: turn ? { end: turn.end } : {} });
    V.byItem.set(itemId, m);
    if (turn && m.lat.end) m.lat.firstText = Math.round(performance.now() - m.lat.end);
  }
  return m;
}
function handle(ev) {
  if (ev.type === 'response.audio.delta') {
    if (!V.audioLogged) { dbg('voice.in', { type: ev.type, item_id: ev.item_id, bytes: (ev.delta || '').length }); V.audioLogged = true; }
  } else {
    dbg('voice.in', ev.type.endsWith('.delta') ? { type: ev.type, item_id: ev.item_id, delta: ev.delta } : ev);
  }
  switch (ev.type) {
    case 'input_audio_buffer.speech_started':
      V.userSpeaking = true;
      bargeIn(false); // the server cancels the response itself (interrupt_response)
      userMsg(ev.item_id);
      break;
    case 'input_audio_buffer.speech_stopped':
      V.userSpeaking = false;
      // the end of speech is the last loud microphone chunk, not the VAD's decision after its hangover
      V.turnEnd = V.lastLoudMic && performance.now() - V.lastLoudMic < 3000 ? V.lastLoudMic : performance.now();
      V.pendingTurn = { end: V.turnEnd };
      break;
    case 'input_audio_buffer.committed':
      V.thinking = true;
      if (S.mode === 'ptt') userMsg(ev.item_id);
      break;
    case 'localrouter.transcription.partial': {
      const m = userMsg(ev.item_id);
      if (m.partial) { m.text = ev.transcript || ''; draw(m); }
      break;
    }
    case 'conversation.item.input_audio_transcription.completed': {
      const m = userMsg(ev.item_id);
      m.partial = false;
      m.text = ev.transcript || '';
      if (!m.text) { m.gone = true; cur.msgs.splice(cur.msgs.indexOf(m), 1); V.pendingTurn = null; }
      draw(m);
      saveConv();
      break;
    }
    case 'conversation.item.input_audio_transcription.failed': {
      const m = userMsg(ev.item_id);
      m.partial = false;
      m.text = '(not heard)';
      m.error = (ev.error && ev.error.message) || 'transcription failed';
      draw(m);
      break;
    }
    case 'response.created':
      V.resp = ev.response && ev.response.id;
      V.audioLogged = false;
      break;
    case 'response.audio_transcript.delta':
    case 'response.text.delta': {
      V.thinking = false;
      const m = botMsg(ev.item_id);
      m.text += ev.delta || '';
      draw(m);
      break;
    }
    case 'response.audio.delta':
      V.thinking = false;
      botMsg(ev.item_id);
      play(ev.item_id, ev.delta);
      break;
    case 'response.output_item.done':
      if (ev.item && ev.item.type === 'function_call') {
        const kind = ev.item.name === 'generate_video' ? 'a video' : 'a picture';
        let args = {};
        try { args = JSON.parse(ev.item.arguments || '{}'); } catch {}
        V.byCall.set(ev.item.call_id, addMsg({ role: 'tool', text: `making ${kind}: ${args.prompt || ''}`, via: 'voice' }));
        saveConv();
      }
      break;
    case 'localrouter.job.done': {
      const m = V.byCall.get(ev.call_id) || addMsg({ role: 'tool', text: '', via: 'voice' });
      if (ev.status === 'completed') m.media = (ev.urls || []).map(u => ({ kind: ev.kind === 'video' ? 'video' : 'image', url: href(u) })).filter(x => x.url);
      else { m.error = ev.error || ev.status; m.text = `${ev.kind || 'job'} ${ev.status || 'failed'}: ${ev.error || ''}`; }
      draw(m);
      saveConv();
      break;
    }
    case 'localrouter.response.timing': {
      const m = [...V.byItem.values()].reverse().find(x => x.role === 'assistant');
      const t = ev.ms || {};
      if (m && ev.from === 'speech_stopped') {
        const d = (a, b) => (t[a] != null && t[b] != null ? t[a] - t[b] : null);
        const parts = [['STT', d('stt_end', 'stt_start')], ['chat', d('first_token', 'chat_start')], ['TTS', d('tts_first_pcm', 'tts_start')]].filter(x => x[1] != null);
        m.lat = Object.assign(m.lat || {}, { stages: parts.map(([k, v]) => `${k} ${v}`).join(' · '), server: ev });
        draw(m);
      }
      break;
    }
    case 'response.done': {
      V.thinking = false;
      V.resp = null;
      V.lead = Math.max(0.1, V.lead * 0.8);
      const r = ev.response || {};
      for (const o of r.output || []) {
        const m = V.byItem.get(o.id);
        if (!m) continue;
        m.streaming = false;
        if (r.status === 'cancelled') m.interrupted = true;
        if (r.status === 'failed') m.error = 'failed';
        if (!m.text && !m.interrupted) { m.gone = true; cur.msgs.splice(cur.msgs.indexOf(m), 1); }
        draw(m);
      }
      saveConv();
      break;
    }
    case 'error':
      note((ev.error && ev.error.message) || 'error', true);
      break;
  }
  renderVoice();
}

// ---------------------------------------------------------------- controls

function renderVoice() {
  const mic = $('mic');
  let s = 'off', label = 'voice off';
  if (V.ws && V.ws.readyState === WebSocket.CONNECTING) { s = 'connecting'; label = 'connecting…'; }
  else if (V.ws) {
    if (V.holding) { s = 'talking'; label = 'listening (release to send)'; }
    else if (S.mode === 'vad' && V.muted) { s = 'muted'; label = 'muted'; }
    else { s = S.mode === 'vad' ? 'listening' : 'ready'; label = S.mode === 'vad' ? 'listening' : 'hold the mic to talk'; }
  }
  mic.dataset.s = s;
  mic.textContent = s === 'muted' ? '🔇' : '🎤';
  mic.title = !V.ws ? 'Start voice' : S.mode === 'ptt' ? 'Hold to talk' : V.muted ? 'Unmute' : 'Mute';
  let vs = V.ws ? (V.userSpeaking ? 'you' : V.live.length ? 'speaking' : V.thinking ? 'thinking' : s) : 'off';
  $('vstate').dataset.s = vs;
  $('vstate').textContent = vs === 'you' ? 'hearing you…' : vs === 'speaking' ? 'speaking' : vs === 'thinking' ? 'thinking…' : label;
  $('hush').hidden = !(V.ws && (V.live.length || V.resp));
  $('hangup').hidden = !V.ws;
  $('text').placeholder = V.ws ? 'Type, and hear the reply' : 'Message';
}
function renderControls() {
  $('send').textContent = busy ? 'Stop' : 'Send';
  $('send').classList.toggle('primary', !busy);
  $('regen').disabled = !!busy || !cur.msgs.some(m => m.role === 'user') || !!V.ws;
  $('think').textContent = `Reasoning: ${S.think ? 'on' : 'off'}`;
  $('think').classList.toggle('on', S.think);
}
function autosize() { const t = $('text'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 160) + 'px'; }

// The mic: off -> tap starts voice. Hands-free: tap mutes and unmutes. Push to talk: hold to talk.
let pressAt = 0;
$('mic').addEventListener('contextmenu', e => e.preventDefault());
$('mic').addEventListener('pointerdown', e => {
  e.preventDefault();
  pressAt = performance.now();
  V.pressConnects = !V.ws;
  if (!V.ws) return; // started on release: a touch is a user gesture (audio may start) only when it ends
  if (S.mode === 'ptt') { try { $('mic').setPointerCapture(e.pointerId); } catch {} pttDown(); }
});
for (const t of ['pointerup', 'pointercancel']) $('mic').addEventListener(t, () => {
  if (V.pressConnects) { V.pressConnects = false; if (t === 'pointerup') voiceStart(); return; }
  if (!V.ws) return;
  if (S.mode === 'ptt') return pttUp();
  if (t === 'pointerup' && V.ws.readyState === WebSocket.OPEN && performance.now() - pressAt < 600) {
    V.muted = !V.muted;
    if (V.muted) vsend({ type: 'input_audio_buffer.clear' });
    renderVoice();
  }
});
document.addEventListener('pointerup', () => { if (V.ctx && V.ctx.state === 'suspended') V.ctx.resume(); });
if (navigator.audioSession) try { navigator.audioSession.type = 'play-and-record'; } catch {} // iOS: audible with the ringer off
$('hush').onclick = () => bargeIn(true);
$('hangup').onclick = () => voiceStop();
$('send').onclick = () => (busy ? busy.ctl.abort() : sendText());
$('text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendText(); } });
$('text').addEventListener('input', autosize);
$('regen').onclick = regenerate;
$('think').onclick = () => { S.think = !S.think; saveSettings(); renderControls(); };
$('mode').value = S.mode;
$('mode').onchange = () => { S.mode = $('mode').value; saveSettings(); V.holding = false; sessionUpdate(); renderVoice(); };
$('speech').onchange = () => { S.speechModel = $('speech').value; fillVoices(); saveSettings(); sessionUpdate(); };
$('voice').onchange = () => { S.voice = $('voice').value; saveSettings(); sessionUpdate(); };
$('conv').onchange = () => { if (!busy) openConv($('conv').value); else $('conv').value = cur.id; };
$('new').onclick = () => { if (busy) return; newConv(); openConv(cur.id); };
$('gear').onclick = () => {
  $('maxtok').value = S.maxTokens || ''; $('silence').value = S.silence; $('threshold').value = S.threshold; $('tools').checked = S.tools;
  $('gate').checked = S.gate; $('logn').value = S.logN; $('key').value = S.key; $('instructions').value = S.instructions;
  $('settings').showModal();
};
$('settings').addEventListener('close', () => {
  Object.assign(S, { chatModel: $('chatmodel').value, maxTokens: Number($('maxtok').value) || 0, silence: Number($('silence').value) || 500,
    threshold: Math.max(0, Math.min(1, Number($('threshold').value) || 0.5)), tools: $('tools').checked, gate: $('gate').checked,
    logN: Number($('logn').value) || 300, key: $('key').value.trim(), instructions: $('instructions').value });
  saveSettings();
  sessionUpdate();
});
$('wipe').onclick = () => {
  if (!confirm('Delete this conversation from this browser?')) return;
  convs = convs.filter(c => c !== cur);
  store.set('convs', convs);
  $('settings').close();
  openConv((convs[0] || newConv()).id);
};
$('copylog').onclick = async () => {
  const head = { page: location.pathname, ua: navigator.userAgent, settings: Object.assign({}, S, { key: S.key ? '(set)' : '' }),
                 tools: (tools.data || []).map(t => [t.id, t.state]), voice: !!V.ws, lead_s: V.lead };
  const text = [JSON.stringify(head), ...debug.slice(-S.logN).map(e => JSON.stringify(e))].join('\n');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch {}
  if (!ok) {
    const t = Object.assign(document.createElement('textarea'), { value: text });
    document.body.append(t); t.select();
    try { ok = document.execCommand('copy'); } catch {}
    t.remove();
  }
  $('copylog').textContent = ok ? `Copied ${Math.min(debug.length, S.logN)}` : 'Copy failed';
  setTimeout(() => { $('copylog').textContent = 'Copy log'; }, 1800);
};
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { pollTools(); if (V.ws && !V.lock && navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { V.lock = l; }).catch(() => {}); }
});

// A test or another script can see the state without scraping the page.
window.jarvis = { get conversation() { return cur; }, get voice() { return { connected: !!V.ws, live: V.live.length, thinking: V.thinking, lead: V.lead }; }, debug, settings: S };

$('insecure').hidden = window.isSecureContext;
openConv(store.get('current', null) || (convs[0] && convs[0].id));
renderControls();
renderVoice();
loadModels().then(pollTools);
setInterval(pollTools, 4000);
</script>
</body>
