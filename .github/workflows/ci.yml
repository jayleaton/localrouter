name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.17.0 and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl --fail --location https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o /tmp/zig.tar.xz
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - run: zig build
      - run: zig build test
        timeout-minutes: 20
      - name: zig fmt on this branch's files (temporary)
        if: always()
        run: |
          files="build.zig src/api/http.zig src/api/mcp.zig src/api/routes.zig src/api/speech.zig src/config.zig src/engine/engine.zig src/engine/worker.zig src/sched/jobs.zig src/sched/scheduler.zig src/serve.zig src/tool/process.zig src/tool/request.zig src/tool/tool.zig src/tool/wire.zig tests/drama3.zig tests/integration.zig "
          zig fmt --check $files || { zig fmt $files >/dev/null; git diff; exit 1; }
