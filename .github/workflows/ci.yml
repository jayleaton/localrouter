name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Zig 0.17.0 and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl --fail --location https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o /tmp/zig.tar.xz
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: the installer's scripts and manifests parse, and its plan runs (INSTALL.md)
        run: |
          for f in tools/install/*.sh deploy/jarvis/*.sh tools/spark/install.sh tools/spark/prepare.sh; do bash -n "$f"; done
          for f in deploy/profiles/*.json tools/twin/packs/sources/*.json tools/twin/packs/built/*.json; do jq empty "$f"; done
          for p in deploy/profiles/*.json; do tools/install/bootstrap.sh --profile "$(basename "$p" .json)" --prefix "$RUNNER_TEMP/jarvis" --dry-run; done
      - run: zig build
      - run: zig build test
        timeout-minutes: 20
      - name: zig fmt on the Zig files this change touches (prints what it would change)
        if: always()
        run: |
          files=$(git diff --name-only --diff-filter=AMR "$(git merge-base origin/main HEAD)" -- '*.zig')
          if [ -z "$files" ]; then exit 0; fi
          zig fmt $files
          git diff --exit-code -- $files
