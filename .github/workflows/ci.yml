name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Zig 0.17.0 and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl --fail --location https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o /tmp/zig.tar.xz
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: the installer's scripts and manifests parse, and its plan runs (INSTALL.md)
        run: |
          for f in tools/install/*.sh deploy/jarvis/*.sh deploy/mac/*.sh deploy/strix-halo/*.sh deploy/strix-halo/comfyui/*.sh tools/gufo/*.sh tools/spark/install.sh tools/spark/prepare.sh; do bash -n "$f"; done
          for f in deploy/profiles/*.json tools/twin/packs/sources/*.json tools/twin/packs/built/*.json; do jq empty "$f"; done
          for p in deploy/profiles/*.json; do tools/install/bootstrap.sh --profile "$(basename "$p" .json)" --prefix "$RUNNER_TEMP/jarvis" --dry-run; done
          # the Mac service's config: every profile model has its tool entry, each booked and resident as the profile says
          JARVIS=$RUNNER_TEMP/jarvis RENDER_ONLY=1 deploy/mac/install.sh | jq -e --slurpfile p deploy/profiles/mac-apple-silicon.json '
            ($p[0].models | map({key: .id, value: .}) | from_entries) as $m
            | (.tools | length) == ($m | length) and all(.tools[]; .resident_bytes == $m[.id].memory_bytes and .residency == (if $m[.id].warm == true then "always" else "on_demand" end))' > /dev/null
      - name: AMD detection against recorded hosts (tests/fixtures/amd; no GPU)
        run: bash tools/install/test_amd.sh
      - name: the openai_audio worker against a fake server (no GPU)
        run: python3 -I tools/speech/openai_audio/test_worker.py
      - name: every lock file pins every artifact by sha256 (tools/install/check_hashes.py), and the pinned downloads verify
        run: |
          python3 -I tools/install/check_hashes.py
          python3 -I tools/install/test_check_hashes.py
          python3 -I tools/install/test_hf_pinned.py
      - name: the Strix Halo unit passes the pinned Gufo image to its workers (no GPU, stub systemd-run and podman)
        run: bash deploy/strix-halo/test_start.sh
      - name: a hard kill of serve.sh's process group removes its Gufo container (stub podman; no GPU)
        run: bash tools/gufo/test_serve.sh
      - name: the MiniMax weights install checks every file against its pins (no network, stub hf)
        run: bash deploy/strix-halo/comfyui/test_install.sh
      - name: the ComfyUI worker against a fake ComfyUI (no GPU)
        run: python3 -I tools/comfyui/test_worker.py
      - name: the ROCm Conv3d workaround node equals PyTorch's conv3d (CPU PyTorch from a lock pinned by sha256; no GPU)
        run: |
          python3 -m venv "$RUNNER_TEMP/torch-cpu"
          "$RUNNER_TEMP/torch-cpu/bin/pip" install -q --require-hashes --no-deps -r deploy/strix-halo/comfyui/requirements-test-cpu.txt \
            --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          "$RUNNER_TEMP/torch-cpu/bin/python" -I deploy/strix-halo/comfyui/test_conv3d_patchify.py
      - run: zig build
      - run: zig build test
        timeout-minutes: 20
      - name: zig fmt on the Zig files this change touches (prints what it would change)
        if: always()
        run: |
          files=$(git diff --name-only --diff-filter=AMR "$(git merge-base origin/main HEAD)" -- '*.zig')
          if [ -z "$files" ]; then exit 0; fi
          zig fmt $files
          git diff --exit-code -- $files
  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: lint (expo lint)
        run: pnpm lint
      - name: type-check (the app, and the headless check under Node)
        run: pnpm type-check
      - name: unit tests (protocol, conversation, voice decisions)
        run: pnpm test
  desktop-helper:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop-helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop-helper/package-lock.json
      - run: npm ci
      - name: type-check (tsc --noEmit)
        run: npm run type-check
      - name: tests (vitest, fake backend)
        run: npm test
  companion:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/companion/package-lock.json
      - run: npm ci
      - name: type-check (tsc --noEmit, the executor and the helper code it reuses)
        run: npm run type-check
      - name: lint (eslint)
        run: npm run lint
      - name: tests (vitest; policy parity with the box, approvals, the broker on the fake Mac)
        run: npm test
