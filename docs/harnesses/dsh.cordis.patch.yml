# DeepSeek Harness (dsh) 0.2.1-rc.2: the Spark's LocalRouter as the model, and its MCP tools.
# $DSH_HOME/profiles/headless/cordis.patch.yml (the web profile: profiles/web/cordis.patch.yml).
- id: llm-pi-ai
  config:
    providers:
      spark:
        api: openai-completions
        baseURL: !!js process.env.LOCALROUTER_URL + '/v1'
        apiKeyEnv: LOCALROUTER_TOKEN
        timeoutMs: 600000
        streamIdleTimeoutMs: 300000
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: qwen3.8-27b
            contextWindow: 32768
            maxTokens: 8192
            input: [text]
- id: agent-default-model
  config:
    provider: spark
    model: qwen3.8-27b
- insert:
    - id: mcp-spark
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: spark
        url: !!js process.env.LOCALROUTER_URL + '/mcp'
        headers:
          Authorization: !!js "'Bearer ' + process.env.LOCALROUTER_TOKEN"
        toolCallTimeoutMs: 600000
        failOnStartupError: true
